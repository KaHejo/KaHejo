<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Vibrant Glowing Gradients -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leafFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#34d399" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Group with Glow -->
  <g filter="url(#glow)">
    <!-- Vertical Spine of 'K' -->
    <rect x="18" y="24" width="8.5" height="28" rx="4.25" fill="url(#neonGradient)" />

    <!-- Stylized Top Leaf (Pointed Eco Leaf) -->
    <path d="M42 48 C44 26, 68 15, 80 16 C80 26, 73 45, 52 50 Z" 
          fill="url(#leafFill)" />
    <!-- Leaf Center Vein -->
    <path d="M44 46 C56 36, 68 26, 76 19" 
          stroke="#064e3b" 
          stroke-width="2" 
          stroke-linecap="round" 
          opacity="0.75" />

    <!-- Continuous Infinity / Energy Loop Ribbon forming the 'K' arms -->
    <path d="M22 50 
             C36 34, 48 42, 60 55 
             C72 68, 85 73, 91 66 
             C98 59, 92 48, 81 48 
             C69 48, 56 64, 44 74 
             C32 84, 18 78, 18 67 
             C18 56, 32 46, 52 60 
             C64 69, 78 78, 88 74" 
          stroke="url(#neonGradient)" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
